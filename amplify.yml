version: 1
applications:
  - backend:
      phases:
        build:
          commands:
            - corepack enable
            - yarn set version stable
            - yarn config set nodeLinker node-modules
            - yarn install --immutable
            - yarn ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        build:
          commands:
            - mkdir ./dist && touch ./dist/index.html
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
      buildPath: packages/backend
    appRoot: packages/backend
